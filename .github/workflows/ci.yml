name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: 自检 + 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 语法检查（全部脚本可编译）
        run: |
          python3 -m compileall -q scripts tests
          echo "✅ compileall 通过"

      - name: 单元测试
        run: python3 -m unittest discover -s tests -v

      - name: 仓库自检（文档 ↔ 脚本一致性）
        run: python3 scripts/selfcheck.py

      - name: 示例人格静态质检
        run: python3 scripts/fidelity_check.py examples/skeptic-cfo-persona/SKILL.md

      - name: 全部脚本支持 --help
        run: |
          set -e
          for s in scripts/*.py; do
            case "$s" in */_yaml_subset.py) continue;; esac
            python3 "$s" --help > /dev/null
            echo "✅ $s --help"
          done
